# AIS collector deployment mode
# local_scheduled  — Windows Task Scheduler on your PC ($0/mo; gaps when PC off)
# vps_always_on    — cheap VPS ~$5/mo for true 24/7 continuity
mode: local_scheduled

aisstream:
  # Official limits (https://aisstream.io/documentation, re-checked 2026-09-07):
  #   - MMSI filters: 200 per subscription
  #   - Connections per account: 3 subscribed
  #   - Connections per originating IP: 3 open
  #   - Subscription updates: 1 per second per connection
  # Empirical probe: 200 MMSI → SubscriptionConfirmation; 201+/500 → socket close
  # after subscribe (often WITHOUT HTTP 429). Multi-socket batching violates the
  # 3-connection cap — sentinel uses ONE persistent WS + rotation.
  mmsi_per_subscription: 200
  mmsi_batch_size: 200  # legacy alias for collector.py
  websocket_url: wss://stream.aisstream.io/v0/stream
  max_batches: null
  stagger_seconds: 2.5
  max_concurrent_handshakes: 1
  unreachable_after_consecutive_failures: 3
  reconnect_backoff_initial_seconds: 1
  reconnect_backoff_max_seconds: 60
  rate_limit_backoff_initial_seconds: 30
  rate_limit_backoff_max_seconds: 300
  reconnect_alert_after_attempts: 10
  silence_watchdog_seconds: 600
  sqlite_timeout_seconds: 30

# Sentinel live AIS connector (services/aisstream_connector.py)
# API key is NOT stored here — loaded from environment / .env:
#   AISSTREAM_API_KEY  (required)
#   DATABASE_URL       (optional Postgres/Timescale dual-store)
sentinel:
  fleet_top_n: 1001
  batch_size: 50
  flush_interval_sec: 1.0
  heartbeat_interval_seconds: 15.0
  coverage_log_interval_seconds: 120
  silence_watchdog_seconds: 600
  silence_force_reconnect: false
  # single_persistent = ONE WS; rotate ≤200 MMSI subsets across TOP-500
  # bbox_global = world stream without MMSI filter (degraded coverage)
  subscription_mode: single_persistent
  mmsi_per_subscription: 200
  rotation_interval_seconds: 180
  try_full_mmsi_list: false
  subscribe_rate_per_minute: 6
  subscribe_burst: 3
  filter_message_types:
    - PositionReport
    - ShipStaticData
    - StandardClassBPositionReport
    - ExtendedClassBPositionReport
  # websocket_url inherited from aisstream.websocket_url unless overridden
  # api_key_env: AISSTREAM_API_KEY

# API credentials are NEVER stored in this file.
# Unified registry (Contract 1.8.0-ops-gis-sot): services/config_keys.py
# Canonical env names — set in gitignored .env only:
#   NEWSAPI_KEY, GIE_API_KEY, AISSTREAM_API_KEY (alias AISSTREAM_KEY),
#   FIRMS_MAP_KEY, EXCHANGERATE_KEY, NASDAQ_DATA_KEY, BREVO_API_KEY

paths:
  history_dir: история1
  targets: targets.json
  db: история1/raw_positions.db
  sentinel_db: история1/sentinel_ais.db
  fleet_database: output/fleet_database.csv
  # External TTF (gas) / Brent (oil) prices — user-supplied file, offline.
  # Alias: PRICE_SOURCE_PATH. Supported: .csv / .xlsx / .json
  # Wide: date + ttf + brent columns (flexible name aliases).
  # Long: date + symbol/name + value/price/close.
  price_source: input/prices.csv

causal:
  max_ffill_days: 3          # forward-fill market holidays; never infinite
  min_intersection_points: 30
  granger_max_lag: 14
  multiple_testing: fdr      # fdr | bonferroni
  alpha: 0.05
  dwt_value_col: laden_dwt_sum

schedule:
  # daily snapshot at 00:05 UTC
  snapshot_utc: "00:05"
  archive_start: "2026-07-28"

budget:
  # Leg A — AIS / infra (free stream + optional always-on VPS)
  aisstream: 0          # free tier
  vps_optional_usd: 5   # only if mode=vps_always_on
  total_cap_usd: 30
  # Leg B — paid gas weekly monitor (see PROVIDER_MONTHLY_BUDGET_USD / budget_ledger.py)
  gas_weekly_cap_usd: 50
  # Combined soft ceiling for operator dashboards (30 + 50)
  combined_cap_usd: 80
  ledger_report: features/budget_ledger.json

gas_weekly:
  # Priority universe for paid weekly poll (risk tier → DWT desc)
  top_n_target: 500
