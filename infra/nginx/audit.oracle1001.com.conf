# Sentinel HUD edge — audit.oracle1001.com
# TLS material is the existing certbot cert (same path as api.oracle1001.com).
# HSTS is omitted on purpose during the pilot.
# Sentinel has no /api/v1/admin* routes, so this edge does not add basic-auth.
# X-API-Key is checked by Sentinel itself.

limit_req_zone $binary_remote_addr zone=audit:10m rate=30r/m;
limit_req_status 429;

log_format audit_timed '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time';

upstream sentinel_korolev {
    server 45.8.230.214:8765;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name audit.oracle1001.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name audit.oracle1001.com;

    ssl_certificate     /etc/letsencrypt/live/audit.oracle1001.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audit.oracle1001.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 4m;
    access_log /var/log/nginx/audit.access.log audit_timed;

    error_page 502 504 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /var/www/audit;
        default_type text/html;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location /output/ {
        limit_req zone=audit burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_pass http://sentinel_korolev;
    }

    location /api/v1/ {
        limit_req zone=audit burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_pass http://sentinel_korolev;
    }

    location / {
        return 302 /output/sentinel_dashboard.html;
    }
}
